# Bolt config for autoresearch - GPT training with GPU
# Submit with: bolt task submit --config bolt.yaml [--interactive]
# Docs: https://docs.bolt.apple.com/reference/api-cli.html

name: autoresearch-train

setup_command: bash setup_claude_and_uv.sh

command: |
  uv sync
  uv run prepare.py
  uv run train.py

resources:
  # TODO: Update task_type to a GPU type available in your project.
  # Common GPU task types: 1gpu, 2gpu, 4gpu, 8gpu, 1h100, etc.
  # Check with: bolt quota show --project-id <your_project_id>
  task_type: 1gpu
  cluster:
    - aws_4
    - gcp_4
  docker_image: docker.apple.com/bolt/cuda:12.6.1-ubuntu22.04-efa1.29.1-cudnn-devel
  memory_gb: 64.0
  num_cpus: 16
  disk_gb: 100.0
  timeout: 7D

environment_variables:
  CUDA_VISIBLE_DEVICES: "0"
  CKPT_DIR: "${BOLT_ARTIFACT_DIR}/checkpoints"
  PATH: "/var/bolt_python/include/python3.10:$PATH"
  HF_TOKEN: "REDACTED"

tags:
  - autoresearch

attribution:
  mldb_token: mldb-znylp4pal3
project_id: lw_project

expires_in: 7d
